<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Prooflytics{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-bg: #451a1a;
      --success: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: #0b1120;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-danger {
      background-color: var(--danger);
      color: white;
    }
    .btn-secondary {
      background-color: #334155;
      color: var(--text);
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .alert-danger {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-dialog {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-metric { background-color: #1e3a8a; color: #93c5fd; }
    .badge-bar_chart { background-color: #581c87; color: #d8b4fe; }
    .badge-line_chart { background-color: #064e3b; color: #6ee7b7; }
    .badge-top_n_table { background-color: #78350f; color: #fde68a; }
    .badge-note { background-color: #374151; color: #d1d5db; }
    footer {
      border-top: 1px solid var(--card-border);
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #111827 !important;
      }
      header, footer, .nav-actions, .no-print, button, form, .modal-overlay, .public-banner {
        display: none !important;
      }
      .card, .block-card {
        background: #ffffff !important;
        border: 1px solid #e5e7eb !important;
        color: #111827 !important;
        box-shadow: none !important;
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 1.5rem !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      canvas {
        max-width: 100% !important;
      }
      h1, h2, h3, p, span, div, td, th {
        color: #111827 !important;
      }
      pre {
        background: #f3f4f6 !important;
        color: #1f2937 !important;
        border: 1px solid #e5e7eb !important;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="brand">📊 Prooflytics</a>
    <div class="nav-actions">
      {% if current_user %}
        <span style="color: var(--text-muted); font-size: 0.9rem;">{{ current_user.email }}</span>
        <form method="POST" action="/logout" style="display: inline;">
          <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">
          <button type="submit" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Sign out</button>
        </form>
      {% else %}
        <a href="/login" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Sign in</a>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Prooflytics &copy; ByteVox Build Assignment &middot; Correctness, Provenance &amp; Privacy
  </footer>

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
