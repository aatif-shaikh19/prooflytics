<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Prooflytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --card-bg: #18181b;
      --card-border: #27272a;
      --card-hover: #222226;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.15);
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --danger-bg: rgba(244, 63, 94, 0.1);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    header {
      background: rgba(18, 18, 21, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 1rem;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 6px;
      font-size: 0.85rem;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .brand-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    main {
      flex: 1;
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.15s ease;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: #0c0c0e;
      color: var(--text);
      font-family: inherit;
      font-size: 0.925rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.15rem;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    button:focus-visible, .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }
    .btn-danger:hover {
      background-color: var(--danger-hover);
    }
    .btn-secondary {
      background-color: #27272a;
      border-color: #3f3f46;
      color: var(--text);
    }
    .btn-secondary:hover {
      background-color: #3f3f46;
      color: #ffffff;
    }
    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
    }
    .alert {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .alert-danger {
      background-color: var(--danger-bg);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }
    .alert-success {
      background-color: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-dialog {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.725rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-metric { background-color: rgba(37, 99, 235, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-bar_chart { background-color: rgba(147, 51, 234, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-line_chart { background-color: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-top_n_table { background-color: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-note { background-color: rgba(113, 113, 122, 0.15); color: #e4e4e7; border: 1px solid rgba(113, 113, 122, 0.3); }
    .badge-accepted { background-color: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-warning { background-color: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rejected { background-color: var(--danger-bg); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    
    footer {
      border-top: 1px solid var(--card-border);
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #111827 !important;
      }
      header, footer, .nav-actions, .no-print, button, form, .modal-overlay, .public-banner {
        display: none !important;
      }
      .card, .block-card {
        background: #ffffff !important;
        border: 1px solid #e5e7eb !important;
        color: #111827 !important;
        box-shadow: none !important;
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 1.5rem !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      canvas {
        max-width: 100% !important;
      }
      h1, h2, h3, p, span, div, td, th {
        color: #111827 !important;
      }
      pre {
        background: #f3f4f6 !important;
        color: #1f2937 !important;
        border: 1px solid #e5e7eb !important;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span class="brand-icon">⚡</span>
      <span>Prooflytics</span>
      <span class="brand-badge">PROVENANCE ENGINE</span>
    </a>
    <div class="nav-actions">
      {% if current_user %}
        <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500;">{{ current_user.email }}</span>
        <form method="POST" action="/logout" style="display: inline;">
          <input type="hidden" name="csrf_token" value="{{ current_session.csrf_token if current_session else '' }}">
          <button type="submit" class="btn btn-secondary btn-sm">Sign out</button>
        </form>
      {% else %}
        <a href="/login" class="btn btn-primary btn-sm">Sign in</a>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Prooflytics &middot; Server-Side Certified Provenance, Access Control &amp; Data Auditing
  </footer>

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
